<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dynamic Wallpaper — Settings</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: rgba(255, 255, 255, 0.04);
        --panel-edge: rgba(255, 255, 255, 0.09);
        --text: #e8ecf4;
        --muted: #8b93a7;
        --accent: #22d3ee;
        --accent-dim: rgba(34, 211, 238, 0.16);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        /* A faint wash echoing the two blobs, so the settings window belongs to the wallpaper. */
        background-image:
          radial-gradient(620px 380px at 12% -10%, rgba(34, 211, 238, 0.13), transparent 60%),
          radial-gradient(620px 380px at 108% 112%, rgba(255, 138, 61, 0.12), transparent 60%);
      }

      /* Drag region: the window is frameless, so the header is what moves it. */
      header {
        -webkit-app-region: drag;
        padding: 16px 20px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
      }
      header .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        box-shadow: 0 0 10px currentColor;
      }
      header h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      header .spacer {
        flex: 1;
      }
      #close {
        -webkit-app-region: no-drag;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
      }
      #close:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 4px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      main::-webkit-scrollbar {
        width: 9px;
      }
      main::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 5px;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 12px;
        padding: 14px 16px 16px;
      }
      h2 {
        font-size: 10.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
        margin-bottom: 12px;
      }

      .themes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .theme {
        -webkit-app-region: no-drag;
        border: 1px solid var(--panel-edge);
        background: rgba(255, 255, 255, 0.02);
        border-radius: 9px;
        padding: 9px 10px;
        cursor: pointer;
        text-align: left;
        color: var(--text);
        font-family: inherit;
        transition: border-color 0.12s, background 0.12s;
      }
      .theme:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .theme[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-dim);
      }
      .theme .name {
        font-size: 12px;
        font-weight: 500;
        margin-bottom: 7px;
      }
      .swatches {
        display: flex;
        gap: 4px;
      }
      .swatch {
        width: 13px;
        height: 13px;
        border-radius: 50%;
      }

      .row {
        display: grid;
        grid-template-columns: 104px 1fr 44px;
        align-items: center;
        gap: 12px;
        padding: 5px 0;
      }
      .row label {
        color: var(--muted);
        font-size: 12px;
      }
      .row output {
        text-align: right;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 11.5px;
      }
      input[type="range"] {
        -webkit-app-region: no-drag;
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.14);
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        border: 0;
      }

      footer {
        flex: none;
        padding: 0 20px 18px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      footer .spacer {
        flex: 1;
      }
      button.action {
        -webkit-app-region: no-drag;
        border: 1px solid var(--panel-edge);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
      }
      button.action:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      .hint {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" style="color: #22d3ee; background: #22d3ee"></span>
      <span class="dot" style="color: #ff8a3d; background: #ff8a3d"></span>
      <h1>Dynamic Wallpaper</h1>
      <span class="spacer"></span>
      <button id="close" title="Close">✕</button>
    </header>

    <main>
      <section>
        <h2>Theme</h2>
        <div class="themes" id="themes"></div>
      </section>

      <section>
        <h2>Appearance</h2>
        <div id="sliders"></div>
      </section>

      <section>
        <h2>Behaviour</h2>
        <label class="toggle"><input type="checkbox" id="paused" /> Pause the wallpaper</label>
        <label class="toggle" style="margin-top: 9px"
          ><input type="checkbox" id="autoStart" /> Start with Windows</label
        >
        <p class="hint" id="displays">—</p>
      </section>
    </main>

    <footer>
      <button class="action" id="reset">Reset to defaults</button>
      <span class="spacer"></span>
      <button class="action" id="quit">Quit wallpaper</button>
    </footer>
  </body>
  <script type="module" src="./main.ts"></script>
</html>
