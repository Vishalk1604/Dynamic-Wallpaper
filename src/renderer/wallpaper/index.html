<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dynamic Wallpaper</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: default;
      }
      #gl {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Diagnostics overlay, enabled by the main process via a data attribute so the shipped
         wallpaper shows nothing but the simulation. */
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        padding: 6px 10px;
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 13px;
        color: #cbd5e1;
        background: rgba(0, 0, 0, 0.65);
        pointer-events: none;
        display: none;
      }
      #hud[data-enabled] {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud"></div>
  </body>
  <script type="module" src="./main.ts"></script>
</html>
