appId: com.vishalk.dynamic-wallpaper
productName: Dynamic Wallpaper
copyright: Copyright © 2026 Vishal K

directories:
  output: release
  # Not `build/`, which .gitignore excludes — the installer script has to be tracked.
  buildResources: build-resources

# `three` is bundled into the renderer by Vite, so it is a devDependency and never reaches here.
# koffi is required at runtime by the main process, so it does.
files:
  - out/**
  - resources/**
  - package.json
  # koffi ships prebuilt binaries for sixteen platforms, 71 MB in total. Only one of them can ever
  # load on the target this installer is built for.
  - "!node_modules/koffi/build/koffi/{darwin_arm64,darwin_x64,freebsd_arm64,freebsd_ia32,freebsd_x64,linux_arm32,linux_arm64,linux_ia32,linux_riscv64,linux_x64,musl_x64,openbsd_ia32,openbsd_x64,win32_arm64,win32_ia32}"
  - "!node_modules/koffi/src/**"
  - "!node_modules/koffi/{CHANGELOG.md,README.md}"

# koffi resolves its .node relative to its own directory and hands the path to dlopen, which cannot
# read through an asar archive.
asarUnpack:
  - "**/node_modules/koffi/**"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  # The app is a tray application with no ordinary window; this keeps the shell from expecting one.
  executableName: DynamicWallpaper

nsis:
  # A wallpaper is a long-lived install, not a throwaway — worth showing the user where it goes.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user, so installing never needs an administrator prompt.
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Dynamic Wallpaper
  uninstallDisplayName: Dynamic Wallpaper
  runAfterFinish: true
  # Settings survive an upgrade or a reinstall.
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-setup.${ext}
  include: build-resources/installer.nsh
